                        ${repPost ? `<p class="text-muted bg-main p-2.5 rounded-xl border border-theme">${esc(repPost.content)}</p>` : ''}
                        ${rep.status === 'pending' ? `
                          <div class="flex items-center gap-2 pt-1">
                            <button type="button" onclick="adminResolveReportItem('${rep.id}', false)" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-bold">إغلاق البلاغ</button>
                            ${repPost ? `<button type="button" onclick="adminResolveReportItem('${rep.id}', true)" class="px-3 py-1.5 rounded-xl bg-rose-600 text-white font-bold">حذف المنشور</button>` : ''}
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="p-4 rounded-2xl bg-card border border-theme space-y-3">
                  <h3 class="font-black text-sm">الكلمات المحظورة</h3>
                  <div class="flex items-center gap-2">
                    <input id="v3-banned-word" type="text" placeholder="أضف كلمة محظورة..." class="flex-1 bg-main border border-theme rounded-xl px-3.5 py-2 text-xs focus:border-accent focus:outline-none" />
                    <button type="button" onclick="adminAddBannedWord()" class="bg-accent text-white font-bold px-4 py-2 rounded-xl text-xs">إضافة</button>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${(nevState.systemSettings.bannedWords || []).map(w => `
                      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-main border border-theme text-xs font-bold">
                        <span>${esc(w)}</span>
                        <button type="button" onclick="adminRemoveBannedWord('${esc(w)}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-xmark"></i></button>
                      </span>
                    `).join('')}
                  </div>
                </div>
              </div>
            ` : ''}

            ${nevSession.adminTab === 'system' ? `
              <div class="space-y-4">
                <div>
                  <label class="block text-xs text-muted mb-1">اسم المنصة</label>
                  <input id="v3-sys-name" type="text" value="${esc(nevState.systemSettings.platformName)}" class="w-full bg-card border border-theme rounded-xl px-4 py-2.5 text-sm focus:border-accent focus:outline-none" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">إعلان المنصة العلوي</label>
                  <input id="v3-sys-ann" type="text" value="${esc(nevState.systemSettings.announcement)}" class="w-full bg-card border border-theme rounded-xl px-4 py-2.5 text-sm focus:border-accent focus:outline-none" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">الوسوم الرائجة (مفصولة بفاصلة)</label>
                  <input id="v3-sys-tags" type="text" value="${esc((nevState.systemSettings.trendingTags || []).join(', '))}" class="w-full bg-card border border-theme rounded-xl px-4 py-2.5 text-sm focus:border-accent focus:outline-none" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">الحد الأقصى لأحرف المنشور</label>
                  <input id="v3-sys-max" type="number" min="100" max="2000" value="${nevState.systemSettings.maxPostLength}" class="w-full bg-card border border-theme rounded-xl px-4 py-2.5 text-sm focus:border-accent focus:outline-none" />
                </div>

                <label class="flex items-center justify-between p-3.5 rounded-2xl border border-theme bg-card/40 cursor-pointer">
                  <div>
                    <div class="font-bold text-xs sm:text-sm">السماح بتسجيل حسابات جديدة</div>
                    <div class="text-[11px] text-muted">فتح أو إغلاق التسجيل</div>
                  </div>
                  <input type="checkbox" ${nevState.systemSettings.allowRegistration ? 'checked' : ''} onchange="nevState.systemSettings.allowRegistration = this.checked; persistNevV3State();" class="w-5 h-5 accent-[var(--accent-color)]" />
                </label>

                <label class="flex items-center justify-between p-3.5 rounded-2xl border border-theme bg-card/40 cursor-pointer">
                  <div>
                    <div class="font-bold text-xs sm:text-sm">توثيق أزرق تلقائي للحسابات الجديدة</div>
                    <div class="text-[11px] text-muted">منح التوثيق الأزرق تلقائياً عند التسجيل</div>
                  </div>
                  <input type="checkbox" ${nevState.systemSettings.autoVerifyNewUsers ? 'checked' : ''} onchange="nevState.systemSettings.autoVerifyNewUsers = this.checked; persistNevV3State();" class="w-5 h-5 accent-[var(--accent-color)]" />
                </label>

                <label class="flex items-center justify-between p-3.5 rounded-2xl border border-theme bg-card/40 cursor-pointer">
                  <div>
                    <div class="font-bold text-xs sm:text-sm text-amber-400">وضع الصيانة</div>
                    <div class="text-[11px] text-muted">قصر الدخول على الأدمن فقط</div>
                  </div>
                  <input type="checkbox" ${nevState.systemSettings.maintenanceMode ? 'checked' : ''} onchange="nevState.systemSettings.maintenanceMode = this.checked; persistNevV3State();" class="w-5 h-5 accent-[var(--accent-color)]" />
                </label>

                <div class="flex flex-wrap gap-2.5 pt-2">
                  <button type="button" onclick="adminSaveSystemSettings()" class="bg-accent text-white font-extrabold px-5 py-2.5 rounded-full text-xs">حفظ إعدادات النظام</button>
                  <button type="button" onclick="adminExportStateJson()" class="px-4 py-2.5 rounded-full border border-theme hover-theme font-bold text-xs">تصدير نسخة JSON</button>
                  <button type="button" onclick="adminResetDefaultState()" class="px-4 py-2.5 rounded-full border border-rose-500 text-rose-400 hover:bg-rose-500 hover:text-white font-bold text-xs transition">
                    إعادة ضبط الافتراضي
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    /**
     * =========================================================================
     * 11. MAIN SHELL, SIDEBARS, MOBILE BAR & IMMEDIATE TOP RENDERING
     * =========================================================================
     */
    function renderDiscoverySidebar() {
      const user = getCurrentUser();
      const tagMap = {};
      nevState.posts.forEach(p => {
        const matches = p.content.match(/#[\u0600-\u06FFa-zA-Z0-9_]+/g) || [];
        matches.forEach(t => {
          tagMap[t] = (tagMap[t] || 0) + 1;
        });
      });
      (nevState.systemSettings.trendingTags || []).forEach(t => {
        if (!tagMap[t]) tagMap[t] = 1;
      });
      const trends = Object.entries(tagMap).sort((a, b) => b[1] - a[1]).slice(0, 4);
      const suggestions = nevState.users.filter(u => (!user || u.id !== user.id) && !u.isBanned).slice(0, 3);

      return `
        <aside class="hidden xl:block w-80 shrink-0 px-4 py-4 space-y-4 sticky top-0 h-screen overflow-y-auto no-scrollbar">
          <div class="flex items-center gap-2.5 bg-card border border-theme rounded-full px-4 py-2.5">
            <i class="fa-solid fa-magnifying-glass text-muted text-sm"></i>
            <input type="text"
                   value="${esc(nevSession.searchQuery)}"
                   oninput="nevSession.searchQuery = this.value; if (nevSession.view !== 'explore') nevSession.view = 'explore'; renderNevV3();"
                   placeholder="بحث في ناف..."
                   class="w-full bg-transparent text-xs focus:outline-none" />
          </div>

          <div class="p-4 rounded-3xl bg-card border border-theme space-y-3">
            <h3 class="font-black text-sm">ماذا يحدث على ناف؟</h3>
            ${trends.map(([tag, cnt], idx) => `
              <button type="button"
                      onclick="nevSession.searchQuery = '${esc(tag)}'; nevSession.view = 'explore'; renderNevV3();"
                      class="w-full text-right p-2 rounded-2xl hover-theme transition block">
                <div class="text-[11px] text-muted">${idx + 1} · رائج في ناف</div>
                <div class="font-extrabold text-xs text-accent mt-0.5" dir="ltr">${esc(tag)}</div>
                <div class="text-[11px] text-muted">${fmtNum(cnt)} منشور</div>
              </button>
            `).join('')}
          </div>

          <div class="p-4 rounded-3xl bg-card border border-theme space-y-3">
            <h3 class="font-black text-sm">حسابات مقترحة</h3>
            ${suggestions.map(u => {
              const followed = user && (user.following || []).includes(u.id);
              return `
                <div class="flex items-center justify-between gap-2">
                  <div onclick="openUserProfile('${u.id}')" class="flex items-center gap-2.5 min-w-0 cursor-pointer">
                    <img src="${esc(u.avatar)}" alt="${esc(u.name)}" onerror="this.src='https://placehold.co/60x60/1d9bf0/ffffff?text=Nev'" class="w-9 h-9 rounded-full object-cover shrink-0" />
                    <div class="min-w-0">
                      <div class="font-extrabold text-xs flex items-center gap-1 truncate">${esc(u.name)} ${renderVerificationBadge(u)}</div>
                      <div class="text-[11px] text-muted truncate" dir="ltr">@${esc(u.username)}</div>
                    </div>
                  </div>
                  ${user ? `
                    <button type="button" onclick="handleFollowUser('${u.id}')" class="px-3 py-1 rounded-full text-[11px] font-extrabold shrink-0 ${followed ? 'border border-theme hover-theme' : 'bg-accent text-white'}">
                      ${followed ? 'يتابَع' : 'متابعة'}
                    </button>
                  ` : `
                    <button type="button" onclick="openUserProfile('${u.id}')" class="px-3 py-1 rounded-full text-[11px] font-bold border border-theme hover-theme shrink-0">عرض</button>
                  `}
                </div>
              `;
            }).join('')}
          </div>

          <!-- Instant Account Switcher -->
          <div class="p-4 rounded-3xl bg-card border border-theme space-y-2.5">
            <h3 class="font-black text-xs text-muted">تبديل سريع بين الحسابات</h3>
            <div class="space-y-1.5">
              ${nevState.users.slice(0, 4).map(acc => {
                const activeAcc = user && user.id === acc.id;
                return `
                  <button type="button"
                          onclick="switchActiveAccountInstant('${acc.id}')"
                          class="w-full text-right px-3 py-2 rounded-2xl text-xs flex items-center justify-between gap-2 transition ${activeAcc ? 'bg-accent-soft border border-accent/40 font-extrabold' : 'hover-theme'}">
                    <span class="truncate">${esc(acc.name)} <span class="text-muted font-normal" dir="ltr">@${esc(acc.username)}</span></span>
                    ${acc.role === 'admin' ? '<i class="fa-solid fa-crown text-amber-400 text-[11px]"></i>' : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </aside>
      `;
    }

    function renderNevV3Shell() {
      const user = getCurrentUser();
      const unreadCount = user
        ? nevState.notifications.filter(n => n.userId === user.id && !n.read).length
        : 0;

      const navItems = [
        { id: 'home', label: 'الرئيسية', icon: 'fa-house', badge: 0 },
        { id: 'explore', label: 'الاستكشاف', icon: 'fa-compass', badge: 0 },
        { id: 'notifications', label: 'الإشعارات', icon: 'fa-bell', badge: unreadCount },
        { id: 'messages', label: 'الرسائل', icon: 'fa-envelope', badge: 0 },
        { id: 'bookmarks', label: 'المحفوظات', icon: 'fa-bookmark', badge: 0 },
        { id: 'profile', label: 'الملف الشخصي', icon: 'fa-user', badge: 0 },
        { id: 'settings', label: 'الإعدادات', icon: 'fa-gear', badge: 0 }
      ];

      if (isCurrentAdmin()) {
        navItems.push({ id: 'admin', label: 'لوحة الأدمن', icon: 'fa-crown', badge: 0 });
      }

      let centerContent = '';
      if (nevSession.view === 'explore') centerContent = renderExploreView();
      else if (nevSession.view === 'notifications') centerContent = renderNotificationsView();
      else if (nevSession.view === 'messages') centerContent = renderMessagesView();
      else if (nevSession.view === 'bookmarks') centerContent = renderBookmarksView();
      else if (nevSession.view === 'profile') centerContent = renderProfileView();
      else if (nevSession.view === 'settings') centerContent = renderSettingsView();
      else if (nevSession.view === 'admin') centerContent = renderAdminView();
      else centerContent = renderHomeView();

      return `
        <div class="min-h-screen w-full bg-main text-main flex justify-center pb-16 lg:pb-0">
          <div class="w-full max-w-7xl flex">
            <!-- Right Sidebar (Desktop & Tablet) -->
            <header class="hidden sm:flex flex-col justify-between w-20 lg:w-64 shrink-0 border-l border-theme px-3 lg:px-5 py-4 sticky top-0 h-screen">
              <div class="space-y-2">
                <button type="button" onclick="nevSession.view = 'home'; renderNevV3();" class="flex items-center gap-3 px-2.5 py-2 rounded-2xl hover-theme w-fit transition">
                  ${nevLogoSvg('w-9 h-9')}
                  <span class="hidden lg:inline font-black text-lg">ناف <span class="text-accent text-xs">v3</span></span>
                </button>

                <nav class="space-y-1 pt-2">
                  ${navItems.map(item => {
                    const active = nevSession.view === item.id;
                    return `
                      <button type="button"
                              onclick="if ('${item.id}' === 'profile') { nevSession.profileUserId = '${user ? user.id : 'u_admin'}'; } nevSession.view = '${item.id}'; renderNevV3(); window.scrollTo(0, 0);"
                              class="w-full flex items-center justify-center lg:justify-start gap-3.5 px-3 py-3 rounded-full hover-theme transition ${active ? 'font-black text-main bg-accent-soft/50' : 'font-semibold text-muted'}">
                        <div class="relative">
                          <i class="fa-solid ${item.icon} text-lg ${active ? 'text-accent' : ''}"></i>
                          ${item.badge > 0 ? `<span class="absolute -top-1.5 -right-2 bg-rose-500 text-white text-[10px] font-black px-1.5 rounded-full">${item.badge}</span>` : ''}
                        </div>
                        <span class="hidden lg:inline text-sm">${item.label}</span>
                      </button>
                    `;
                  }).join('')}
                </nav>

                <button type="button"
                        onclick="nevSession.view = 'home'; renderNevV3(); window.scrollTo(0, 0); setTimeout(() => { const el = document.getElementById('v3-composer-ta'); if (el) el.focus(); }, 40);"
                        class="mt-3 w-12 lg:w-full h-12 lg:h-auto lg:py-3 rounded-full bg-accent text-white font-extrabold text-sm shadow-lg hover:opacity-95 flex items-center justify-center gap-2 transition">
                  <i class="fa-solid fa-feather-pointed"></i>
                  <span class="hidden lg:inline">نشر منشور</span>
                </button>
              </div>

              <div class="pt-3 border-t border-theme">
                ${user ? `
                  <div class="flex items-center justify-between gap-2 p-2 rounded-2xl bg-card/70 border border-theme">
                    <div onclick="openUserProfile('${user.id}')" class="flex items-center gap-2.5 min-w-0 cursor-pointer">
                      <img src="${esc(user.avatar)}" alt="${esc(user.name)}" onerror="this.src='https://placehold.co/60x60/1d9bf0/ffffff?text=Nev'" class="w-9 h-9 rounded-full object-cover shrink-0" />
                      <div class="hidden lg:block min-w-0">
                        <div class="font-extrabold text-xs flex items-center gap-1 truncate">
                          <span>${esc(user.name)}</span>
                          ${renderVerificationBadge(user)}
                        </div>
                        <div class="text-[11px] text-muted truncate" dir="ltr">@${esc(user.username)}</div>
                      </div>
                    </div>
                    <button type="button" onclick="logoutCurrentAccount()" title="تسجيل الخروج" class="hidden lg:flex w-8 h-8 rounded-full hover-theme items-center justify-center text-muted hover:text-rose-400">
                      <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                ` : `
                  <button type="button" onclick="nevSession.isGuest = false; nevSession.authScreen = 'login'; renderNevV3();" class="w-full py-2.5 px-3 rounded-full bg-accent text-white font-extrabold text-xs">
                    تسجيل الدخول
                  </button>
                `}
              </div>
            </header>

            <!-- Center Column -->
            <main class="flex-1 min-w-0 max-w-2xl border-x border-theme/70 min-h-screen bg-main">
              ${centerContent}
            </main>

            <!-- Left Discovery Sidebar -->
            ${renderDiscoverySidebar()}
          </div>

          <!-- Mobile Bottom Navigation -->
          <nav class="sm:hidden fixed bottom-0 inset-x-0 z-30 glass-header flex items-center justify-around py-2 px-1">
            <button type="button" onclick="nevSession.view = 'home'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'home' ? 'text-accent' : 'text-muted'}"><i class="fa-solid fa-house text-lg"></i></button>
            <button type="button" onclick="nevSession.view = 'explore'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'explore' ? 'text-accent' : 'text-muted'}"><i class="fa-solid fa-compass text-lg"></i></button>
            <button type="button" onclick="nevSession.view = 'notifications'; renderNevV3(); window.scrollTo(0,0);" class="p-2 relative ${nevSession.view === 'notifications' ? 'text-accent' : 'text-muted'}">
              <i class="fa-solid fa-bell text-lg"></i>
              ${unreadCount > 0 ? `<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500"></span>` : ''}
            </button>
            <button type="button" onclick="nevSession.view = 'messages'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'messages' ? 'text-accent' : 'text-muted'}"><i class="fa-solid fa-envelope text-lg"></i></button>
            <button type="button" onclick="nevSession.profileUserId = '${user ? user.id : 'u_admin'}'; nevSession.view = 'profile'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'profile' ? 'text-accent' : 'text-muted'}"><i class="fa-solid fa-user text-lg"></i></button>
            ${isCurrentAdmin() ? `
              <button type="button" onclick="nevSession.view = 'admin'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'admin' ? 'text-amber-400' : 'text-muted'}"><i class="fa-solid fa-crown text-lg"></i></button>
            ` : `
              <button type="button" onclick="nevSession.view = 'settings'; renderNevV3(); window.scrollTo(0,0);" class="p-2 ${nevSession.view === 'settings' ? 'text-accent' : 'text-muted'}"><i class="fa-solid fa-gear text-lg"></i></button>
            `}
          </nav>
        </div>
      `;
    }

    function renderNevV3() {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      try {
        applyNevV3Appearance();
        if (!nevSession.currentUserId && !nevSession.isGuest) {
          appEl.innerHTML = renderAuthScreens();
        } else {
          appEl.innerHTML = renderNevV3Shell();
        }
      } catch (err) {
        showNevErrorBanner(`خطأ أثناء الرسم: ${err && err.message ? err.message : 'غير معروف'}`);
        try {
          appEl.innerHTML = `
            <div class="min-h-screen p-6 flex items-center justify-center bg-main text-main">
              <div class="max-w-md w-full p-6 rounded-3xl bg-card border border-theme space-y-4 text-center">
                <h2 class="font-black text-lg">استعادة منصة ناف / Nev</h2>
                <p class="text-xs text-muted">حدث خلل مؤقت وتمت تهيئة وضع الاستعادة السريعة.</p>
                <button type="button" onclick="recoverNevSafe()" class="bg-accent text-white font-extrabold px-5 py-2.5 rounded-full text-xs">إعادة تشغيل التطبيق</button>
              </div>
            </div>
          `;
        } catch (_) {}
      }
    }

    // Immediate paint on script execution AND DOMContentLoaded so no blank/dark/purple screen ever occurs
    renderNevV3();
    document.addEventListener('DOMContentLoaded', () => {
      renderNevV3();
    });
  </script>
</body>
</html>
