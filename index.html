    /**
     * =========================================================================
     * 1. GLOBAL ERROR RESILIENCE & RECOVERY HANDLERS
     * =========================================================================
     */
    const NEV_V3_STORAGE_KEY = 'nev_platform_v3_state';
    const NEV_LEGACY_KEYS = ['nev_v2_5_full_platform_state', 'nev_v2_5_platform_state'];

    let lastRuntimeErrorMsg = '';

    function showNevErrorBanner(message) {
      try {
        lastRuntimeErrorMsg = String(message || 'حدث خطأ غير متوقع وتمت معالجته.');
        const banner = document.getElementById('nev-error-banner');
        const textEl = document.getElementById('nev-error-text');
        if (textEl) textEl.textContent = lastRuntimeErrorMsg;
        if (banner) banner.classList.remove('hidden');
      } catch (_) {}
    }

    function dismissNevErrorBanner() {
      try {
        const banner = document.getElementById('nev-error-banner');
        if (banner) banner.classList.add('hidden');
      } catch (_) {}
    }

    function recoverNevSafe() {
      try {
        dismissNevErrorBanner();
        nevState = createDefaultNevV3State();
        persistNevV3State();
        applyNevV3Appearance();
        renderNevV3();
        notifyNev('تمت استعادة حالة منصة ناف بنجاح', 'success');
      } catch (_) {
        window.location.reload();
      }
    }

    window.addEventListener('error', (event) => {
      try {
        const msg = event && event.message ? `تنبيه: ${event.message}` : 'تنبيه برمجي تم احتواؤه.';
        showNevErrorBanner(msg);
        if (typeof renderNevV3 === 'function') {
          const appEl = document.getElementById('app');
          if (appEl && !appEl.innerHTML.trim()) {
            appEl.innerHTML = renderNevV3Shell();
          }
        }
      } catch (_) {}
    });

    window.addEventListener('unhandledrejection', (event) => {
      try {
        const reason = event && event.reason ? String(event.reason.message || event.reason) : 'عملية غير مكتملة';
        showNevErrorBanner(`تنبيه: ${reason}`);
      } catch (_) {}
    });

    /**
     * =========================================================================
     * 2. AUDIO FEEDBACK & DEFAULT STATE WITH SAFE HYDRATION
     * =========================================================================
     */
    let nevV3AudioCtx = null;

    function playNevSound(type = 'pop') {
      try {
        if (!nevState || !nevState.systemSettings || !nevState.systemSettings.soundEffects) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        if (!nevV3AudioCtx) nevV3AudioCtx = new AudioCtor();
        if (nevV3AudioCtx.state === 'suspended') nevV3AudioCtx.resume();

        const osc = nevV3AudioCtx.createOscillator();
        const gain = nevV3AudioCtx.createGain();
        osc.connect(gain);
        gain.connect(nevV3AudioCtx.destination);

        const t = nevV3AudioCtx.currentTime;
        if (type === 'like') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.exponentialRampToValueAtTime(820, t + 0.09);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, t);
          osc.frequency.setValueAtTime(880, t + 0.08);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, t);
          osc.frequency.linearRampToValueAtTime(150, t + 0.15);
          gain.gain.setValueAtTime(0.04, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
          osc.start(t);
          osc.stop(t + 0.16);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(640, t);
          gain.gain.setValueAtTime(0.03, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (_) {}
    }

    function loadNevV3StateSafe() {
      const fallback = createDefaultNevV3State();
      try {
        let raw = null;
        try {
          raw = localStorage.getItem(NEV_V3_STORAGE_KEY);
          if (!raw) {
            for (const key of NEV_LEGACY_KEYS) {
              const found = localStorage.getItem(key);
              if (found) {
                raw = found;
                break;
              }
            }
          }
        } catch (_) {}

        if (!raw) return fallback;

        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return fallback;

        const state = {
          systemSettings: { ...fallback.systemSettings, ...(parsed.systemSettings || {}) },
          appearance: { ...fallback.appearance, ...(parsed.appearance || parsed.uiPrefs || {}) },
          users: Array.isArray(parsed.users) && parsed.users.length > 0 ? parsed.users : fallback.users,
          posts: Array.isArray(parsed.posts) ? parsed.posts : fallback.posts,
          stories: Array.isArray(parsed.stories) ? parsed.stories : fallback.stories,
          notifications: Array.isArray(parsed.notifications) ? parsed.notifications : fallback.notifications,
          conversations: Array.isArray(parsed.conversations) ? parsed.conversations : fallback.conversations,
          reports: Array.isArray(parsed.reports) ? parsed.reports : fallback.reports,
          botLogs: Array.isArray(parsed.botLogs) ? parsed.botLogs : fallback.botLogs
        };

        if (!Array.isArray(state.systemSettings.trendingTags) || state.systemSettings.trendingTags.length === 0) {
          state.systemSettings.trendingTags = fallback.systemSettings.trendingTags;
        }
        if (!Array.isArray(state.systemSettings.bannedWords)) {
          state.systemSettings.bannedWords = fallback.systemSettings.bannedWords;
        }

        // Ensure Admin / Admin123 account always exists and has admin role
        const adminIdx = state.users.findIndex(
          u => u && (String(u.username || '').toLowerCase() === 'admin' || u.id === 'u_admin')
        );
        if (adminIdx === -1) {
          state.users.unshift(fallback.users[0]);
        } else {
          state.users[adminIdx] = {
            ...fallback.users[0],
            ...state.users[adminIdx],
            id: 'u_admin',
            username: 'Admin',
            password: state.users[adminIdx].password || 'Admin123',
            role: 'admin',
            isBanned: false
          };
        }

        state.users = state.users.map(u => ({
          ...u,
          followers: Array.isArray(u.followers) ? u.followers : [],
          following: Array.isArray(u.following) ? u.following : [],
          blocked: Array.isArray(u.blocked) ? u.blocked : [],
          muted: Array.isArray(u.muted) ? u.muted : [],
          highlightedPostIds: Array.isArray(u.highlightedPostIds) ? u.highlightedPostIds : [],
          drafts: Array.isArray(u.drafts) ? u.drafts : []
        }));

        state.posts = state.posts.map(p => ({
          ...p,
          likes: Array.isArray(p.likes) ? p.likes : [],
          retweets: Array.isArray(p.retweets) ? p.retweets : [],
          bookmarks: Array.isArray(p.bookmarks) ? p.bookmarks : [],
          replies: Array.isArray(p.replies) ? p.replies : [],
          views: typeof p.views === 'number' ? p.views : 100
        }));

        return state;
      } catch (err) {
        try { localStorage.removeItem(NEV_V3_STORAGE_KEY); } catch (_) {}
        return fallback;
      }
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fmtNum(val) {
      const n = Number(val) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'م';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'ألف';
      return String(n);
    }

    function relTime(ts) {
      const sec = Math.max(0, Math.floor((Date.now() - (ts || Date.now())) / 1000));
      if (sec < 60) return sec + 'ث';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + 'د';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + 'س';
      const day = Math.floor(hr / 24);
      if (day < 30) return day + 'ي';
      return Math.floor(day / 30) + 'ش';
    }

    function notifyNev(msg, kind = 'info') {
      try {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const palette = {
          success: 'bg-emerald-600 text-white border-emerald-400/40',
          error: 'bg-rose-600 text-white border-rose-400/40',
          warning: 'bg-amber-600 text-white border-amber-400/40',
          info: 'bg-slate-900 text-white border-sky-400/40'
        };
        const icons = {
          success: 'fa-circle-check',
          error: 'fa-circle-exclamation',
          warning: 'fa-triangle-exclamation',
          info: 'fa-circle-info'
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto border px-4 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-bold flex items-center gap-2.5 animate-fade-in ${palette[kind] || palette.info}`;
        toast.innerHTML = `<i class="fa-solid ${icons[kind] || icons.info} text-base"></i><span>${esc(msg)}</span>`;
        root.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          toast.style.transition = 'all 0.2s ease';
          setTimeout(() => toast.remove(), 220);
        }, 3000);
      } catch (_) {}
    }

    function formatPostRichText(text) {
      const safe = esc(text || '');
      return safe
        .replace(/\n/g, '<br>')
        .replace(/(#[\u0600-\u06FFa-zA-Z0-9_]+)/g, `<button type="button" onclick="event.stopPropagation(); searchByToken('$1')" class="text-accent hover:underline font-bold inline">$1</button>`)
        .replace(/(@[a-zA-Z0-9_]+)/g, `<button type="button" onclick="event.stopPropagation(); searchByToken('$1')" class="text-accent hover:underline font-bold inline" dir="ltr">$1</button>`);
    }

    function searchByToken(token) {
      const clean = String(token || '').replace(/^@/, '');
      if (String(token || '').startsWith('@')) {
        const matched = nevState.users.find(u => String(u.username || '').toLowerCase() === clean.toLowerCase());
        if (matched) {
          openUserProfile(matched.id);
          return;
        }
      }
      nevSession.searchQuery = token;
      nevSession.view = 'explore';
      nevSession.exploreCategory = 'trending';
      renderNevV3();
      window.scrollTo(0, 0);
    }

    function containsBannedWord(text) {
      const list = nevState.systemSettings.bannedWords || [];
      const lower = String(text || '').toLowerCase();
      return list.find(w => w && lower.includes(String(w).toLowerCase())) || null;
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const loginId = (document.getElementById('v3-login-id')?.value || '').trim();
      const loginPw = document.getElementById('v3-login-pw')?.value || '';

      if (!loginId || !loginPw) {
        playNevSound('error');
        notifyNev('يرجى إدخال اسم المستخدم أو البريد وكلمة المرور', 'error');
        return;
      }

      const found = nevState.users.find(
        u =>
          (String(u.username || '').toLowerCase() === loginId.toLowerCase() ||
            String(u.email || '').toLowerCase() === loginId.toLowerCase()) &&
          u.password === loginPw
      );

      if (!found) {
        playNevSound('error');
        notifyNev('بيانات الدخول غير صحيحة. استخدم Admin / Admin123 أو أنشئ حساباً جديداً', 'error');
        return;
      }

      if (found.isBanned) {
        playNevSound('error');
        notifyNev('تم حظر هذا الحساب من إدارة ناف', 'error');
        return;
      }

      if (nevState.systemSettings.maintenanceMode && found.role !== 'admin') {
        playNevSound('warning');
        notifyNev('المنصة في وضع الصيانة حالياً؛ الدخول متاح للأدمن فقط', 'warning');
        return;
      }

      nevSession.currentUserId = found.id;
      nevSession.isGuest = false;
      nevSession.profileUserId = found.id;
      nevSession.view = 'home';
      persistNevV3State();
      playNevSound('success');
      notifyNev(`أهلاً بك يا ${found.name}!`, 'success');
      renderNevV3();
      window.scrollTo(0, 0);
    }

      const password = document.getElementById('v3-reg-password')?.value || '';

      if (!name || !username || !email || !password) {
        playNevSound('error');
        notifyNev('يرجى تعبئة جميع الحقول المطلوبة', 'error');
        return;
      }

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        playNevSound('error');
        notifyNev('اسم المستخدم يجب أن يكون 3 إلى 20 حرفاً إنجليزياً أو أرقاماً أو _', 'error');
        return;
      }

      if (password.length < 6) {
        playNevSound('error');
        notifyNev('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
        return;
      }

      const exists = nevState.users.some(
        u =>
          String(u.username || '').toLowerCase() === username.toLowerCase() ||
          String(u.email || '').toLowerCase() === email.toLowerCase()
      );
      if (exists) {
        playNevSound('error');
        notifyNev('اسم المستخدم أو البريد الإلكتروني مستخدم مسبقاً', 'error');
        return;
      }

      const created = {
        id: 'u_' + Date.now(),
        name,
        username,
        email,
        password,
        bio: 'عضو جديد في منصة ناف (nev-platform-v3) ✨',
        location: 'العالم العربي',
        website: '',
        joinedDate: 'نوفمبر 2026',
        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(username)}&backgroundColor=b6e3f4`,
        banner: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80',
        verified: nevState.systemSettings.autoVerifyNewUsers ? 'blue' : 'none',
        hideVerifiedBadge: false,
        affiliationOrgId: null,
        role: 'user',
        isFakeAccount: false,
        isPrivate: false,
        isBanned: false,
        followers: ['u_admin'],
        following: ['u_admin'],
        blocked: [],
        muted: [],
        pinnedPostId: null,
        highlightedPostIds: [],
        drafts: []
      };

      const adminAcc = nevState.users.find(u => u.id === 'u_admin');
      if (adminAcc && !adminAcc.followers.includes(created.id)) {
        adminAcc.followers.push(created.id);
      }

      nevState.users.push(created);
      nevState.notifications.unshift({
        id: 'n_wel_' + Date.now(),
        userId: created.id,
        actorId: 'u_admin',
        type: 'follow',
        postId: 'p_1',
        text: 'مرحباً بك في منصة ناف (nev-platform-v3)! يسعدنا انضمامك إلينا.',
        read: false,
        createdAt: Date.now()
      });

      persistNevV3State();
      nevSession.onboardingUserId = created.id;
      nevSession.authScreen = 'onboarding';
      playNevSound('success');
      notifyNev('تم إنشاء حسابك! مرحباً بك في شاشة الترحيب', 'success');
      renderNevV3();
      window.scrollTo(0, 0);
    }

    function completeWelcomeOnboarding() {
      const target = nevState.users.find(u => u.id === nevSession.onboardingUserId) || nevState.users[nevState.users.length - 1];
      const bioVal = (document.getElementById('v3-onb-bio')?.value || '').trim();

      if (target) {
        if (bioVal) target.bio = bioVal;
        if (locVal) target.location = locVal;
        persistNevV3State();
        nevSession.currentUserId = target.id;
        nevSession.profileUserId = target.id;

      nevSession.isGuest = false;
      nevSession.onboardingUserId = null;
      nevSession.authScreen = 'welcome';
      nevSession.view = 'home';
      playNevSound('success');
      notifyNev('تم تفعيل حسابك والانتقال إلى ناف!', 'success');
      renderNevV3();
      window.scrollTo(0, 0);

    function openStoryViewer(storyId) {
      const idx = nevState.stories.findIndex(s => s.id === storyId);
      if (idx === -1) return;
      const st = nevState.stories[idx];
      const author = getUserById(st.userId);
      const user = getCurrentUser();

      if (user && !st.seenBy.includes(user.id)) {
        st.seenBy.push(user.id);
        persistNevV3State();
      }

      if (nevSession.storyTimerId) {
        clearTimeout(nevSession.storyTimerId);
        nevSession.storyTimerId = null;
      }

      const nextStory = nevState.stories[idx + 1] || null;

      openModal(`
        <div class="w-full max-w-md rounded-3xl overflow-hidden border border-white/15 shadow-2xl text-white min-h-[540px] flex flex-col justify-between p-5" style="${st.bgGradient ? `background: ${st.bgGradient};` : 'background: linear-gradient(135deg, #0f172a, #1d9bf0);'}">
          <div>
            <div class="w-full h-1 bg-white/25 rounded-full overflow-hidden mb-4">
              <div class="h-full bg-white w-full"></div>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <img src="${esc(author.avatar)}" alt="${esc(author.name)}" onerror="this.src='https://placehold.co/80x80/1d9bf0/ffffff?text=Nev'" class="w-10 h-10 rounded-full object-cover border border-white/40" />
                <div>
                  <div class="font-extrabold text-sm flex items-center gap-1">
                    <span>${esc(author.name)}</span>
                    ${renderVerificationBadge(author)}
                  </div>
                  <div class="text-[11px] text-white/75" dir="ltr">@${esc(author.username)} • ${relTime(st.createdAt)}</div>
                </div>
              </div>
              <button type="button" onclick="stopStoryViewer()" class="w-9 h-9 rounded-full bg-black/35 hover:bg-black/55 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>

          <div class="my-auto py-6 text-center space-y-4">
            ${st.image ? `<img src="${esc(st.image)}" alt="صورة القصة" onerror="this.style.display='none'" class="max-h-60 mx-auto rounded-2xl object-cover border border-white/20 shadow-lg" />` : ''}
            <p class="text-xl sm:text-2xl font-black leading-relaxed">${esc(st.caption)}</p>
          </div>

          <div class="flex items-center justify-between pt-3 border-t border-white/15 text-xs">
            <span>قصص ناف / Nev Stories</span>
            ${nextStory ? `
              <button type="button" onclick="openStoryViewer('${nextStory.id}')" class="px-3.5 py-1.5 rounded-full bg-white/20 hover:bg-white/30 font-bold flex items-center gap-1.5">
                <span>القصة التالية</span>
                <i class="fa-solid fa-chevron-left"></i>
              </button>
            ` : `
              <button type="button" onclick="stopStoryViewer()" class="px-3.5 py-1.5 rounded-full bg-white/20 hover:bg-white/30 font-bold">إنهاء</button>
            `}
          </div>
        </div>
      `);

      nevSession.storyTimerId = setTimeout(() => {
        if (nextStory) {
          openStoryViewer(nextStory.id);
        } else {
          stopStoryViewer();
        }
      }, 6000);
    }

    function stopStoryViewer() {
      if (nevSession.storyTimerId) {
        clearTimeout(nevSession.storyTimerId);
        nevSession.storyTimerId = null;
      }
      closeModal();
      renderNevV3();
    }

    function loadDraftItem(draftId) {
      const u = getCurrentUser();

      nevSession.composer.image = dr.image || '';

    function submitNewPost() {
      const u = requireAuthenticatedUser('نشر منشور جديد');
      if (!u) return;

      const maxLen = nevState.systemSettings.maxPostLength || 280;
      const content = (nevSession.composer.text || '').trim();
      const image = (nevSession.composer.image || '').trim();

      if (!content && !image) {
        playNevSound('error');
        notifyNev('اكتب نصاً أو أضف رابط صورة قبل النشر', 'error');
        return;
      }

      if (content.length > maxLen) {
        playNevSound('error');
        notifyNev(`تجاوزت الحد الأقصى المسموح (${maxLen} حرفاً)`, 'error');
        return;
      }

      const banned = containsBannedWord(content);
      if (banned) {
        playNevSound('error');
        notifyNev(`المنشور يحتوي على كلمة محظورة: ${banned}`, 'error');
        return;
      }

      let pollData = null;
      if (nevSession.composer.showPoll) {
        const cleanOpts = (nevSession.composer.pollOptions || [])
          .map(o => String(o || '').trim())
          .filter(Boolean);
        if (cleanOpts.length >= 2) {
          pollData = {
            question: content || 'استطلاع رأي على ناف',
            options: cleanOpts.map((optText, i) => ({
              id: 'opt_' + Date.now() + '_' + i,
              text: optText,
              votes: []
            })),
            expiresAt: Date.now() + ((Number(nevSession.composer.pollHours) || 24) * 3600000)
          };
        }
      }

      const newPost = {
        id: 'p_' + Date.now(),
        userId: u.id,
        content: content || (pollData ? pollData.question : 'مشاركة صورة على ناف'),
        category: nevSession.composer.category || 'تقنية',
        image,
        poll: pollData,
        likes: [],
        retweets: [],
        bookmarks: [],
        views: 1,
        quotePostId: nevSession.composer.quotePostId || null,
        createdAt: Date.now(),
        replies: []
      };

      nevState.posts.unshift(newPost);

      const mentions = content.match(/@([a-zA-Z0-9_]+)/g) || [];
      mentions.forEach(m => {
        const handle = m.slice(1).toLowerCase();
        const target = nevState.users.find(usr => String(usr.username || '').toLowerCase() === handle);
        if (target && target.id !== u.id) {
          nevState.notifications.unshift({
            id: 'n_men_' + Date.now() + '_' + target.id,
            userId: target.id,
            actorId: u.id,
            type: 'mention',
            postId: newPost.id,
            text: `أشار إليك @${u.username} في منشور جديد`,
            read: false,
            createdAt: Date.now()
          });
        }
      });

      nevSession.composer = {
        text: '',
        image: '',
        showImageInput: false,
        showPoll: false,
        pollOptions: ['', ''],
        pollHours: 24,
        showEmoji: false,
        showDrafts: false,
        category: nevSession.composer.category || 'تقنية',
        quotePostId: null
      };

      persistNevV3State();
      playNevSound('success');
      notifyNev('تم نشر منشورك بنجاح!', 'success');
      renderNevV3();
    }

    function handleLikePost(postId) {
      const u = requireAuthenticatedUser('الإعجاب بالمنشور');
      if (!u) return;
      const post = nevState.posts.find(p => p.id === postId);
      if (!post) return;

      const idx = post.likes.indexOf(u.id);
      if (idx === -1) {
        post.likes.push(u.id);
        playNevSound('like');
        if (post.userId !== u.id) {
          nevState.notifications.unshift({
            id: 'n_like_' + Date.now(),
            userId: post.userId,
            actorId: u.id,
            type: 'like',
            postId: post.id,
            text: 'أعجب بمنشورك',
            read: false,
            createdAt: Date.now()
          });
        }
      } else {
        post.likes.splice(idx, 1);
        playNevSound('pop');
      }
      persistNevV3State();
      renderNevV3();
    }

    function handleRepostPost(postId) {
      const u = requireAuthenticatedUser('إعادة نشر المنشور');
      if (!u) return;
      const post = nevState.posts.find(p => p.id === postId);
      if (!post) return;

      const idx = post.retweets.indexOf(u.id);
      if (idx === -1) {
        post.retweets.push(u.id);
        playNevSound('success');
        notifyNev('تمت إعادة نشر المنشور', 'success');
      } else {
        post.retweets.splice(idx, 1);
        playNevSound('pop');
        notifyNev('تم التراجع عن إعادة النشر', 'info');
      }
      persistNevV3State();
      renderNevV3();
    }

    function handleQuotePost(postId) {
      const u = requireAuthenticatedUser('اقتباس المنشور');
      if (!u) return;
      nevSession.composer.quotePostId = postId;
      nevSession.view = 'home';
      renderNevV3();
      window.scrollTo(0, 0);
      const ta = document.getElementById('v3-composer-ta');
      if (ta) ta.focus();
    }

    function handleBookmarkPost(postId) {
      const u = requireAuthenticatedUser('حفظ المنشور في العلامات المرجعية');
      if (!u) return;
      const post = nevState.posts.find(p => p.id === postId);
      if (!post) return;

      const idx = post.bookmarks.indexOf(u.id);
      if (idx === -1) {
        post.bookmarks.push(u.id);
        playNevSound('success');
        notifyNev('تمت الإضافة إلى العلامات المرجعية', 'success');
      } else {
        post.bookmarks.splice(idx, 1);
        playNevSound('pop');
        notifyNev('تمت الإزالة من العلامات المرجعية', 'info');
      }
      persistNevV3State();
      renderNevV3();
    }

    function handlePollVote(postId, optionId) {
      const u = requireAuthenticatedUser('التصويت في الاستطلاع');
      if (!u) return;
      const post = nevState.posts.find(p => p.id === postId);
      if (!post || !post.poll) return;

      post.poll.options.forEach(opt => {
        const i = opt.votes.indexOf(u.id);
        if (i !== -1) opt.votes.splice(i, 1);
      });

      const chosen = post.poll.options.find(o => o.id === optionId);
      if (chosen) {
        chosen.votes.push(u.id);
        playNevSound('success');
        notifyNev('تم تسجيل صوتك', 'success');
      }
      persistNevV3State();
      renderNevV3();
    }

    function submitPostReply(postId) {
      const u = requireAuthenticatedUser('إرسال رد');
      if (!u) return;
      const post = nevState.posts.find(p => p.id === postId);
      if (!post) return;
      const input = document.getElementById(`v3-reply-input-${postId}`);
      const text = (input ? input.value : '').trim();
      if (!text) {
        notifyNev('اكتب نص الرد أولاً', 'warning');
        return;
      }

      const banned = containsBannedWord(text);
      if (banned) {
        playNevSound('error');
        notifyNev(`الرد يحتوي على كلمة محظورة: ${banned}`, 'error');
        return;
      }

      post.replies.push({
        id: 'rep_' + Date.now(),
        userId: u.id,
        content: text,
        createdAt: Date.now()
      });

      if (post.userId !== u.id) {
        nevState.notifications.unshift({
          id: 'n_rep_' + Date.now(),
          userId: post.userId,
          actorId: u.id,
          type: 'reply',
          postId: post.id,
          text: `رد على منشورك: "${text.slice(0, 45)}"`,
          read: false,
          createdAt: Date.now()
        });
      }

      persistNevV3State();
      playNevSound('success');
      notifyNev('تم إرسال ردك', 'success');
      openPostRepliesModal(postId);
      renderNevV3();
    }

    function wrapCanvasParagraphs(ctx, text, maxWidth) {
      const paras = String(text || '').split('\n');
      const lines = [];
      for (const p of paras) {
        const words = p.split(/\s+/).filter(Boolean);
        if (words.length === 0) {
          lines.push('');
          continue;
        }
        let curr = words[0];
        for (let i = 1; i < words.length; i++) {
          const test = curr + ' ' + words[i];
          if (ctx.measureText(test).width <= maxWidth) {
            curr = test;
          } else {
            lines.push(curr);
            curr = words[i];
          }
        }
        lines.push(curr);
      }
      return lines;
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    function renderIgStoryCanvas() {
      const canvas = document.getElementById('v3-ig-canvas');
      if (!canvas) return;
      const post = nevState.posts.find(p => p.id === nevSession.igStory.postId);
      if (!post) return;
      const author = getUserById(post.userId);
      const th = IG_STORY_THEMES[nevSession.igStory.themeKey] || IG_STORY_THEMES.indigo;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, th.bg1);
      grad.addColorStop(0.52, th.bg2);
      grad.addColorStop(1, th.bg3);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = th.accent;
      ctx.beginPath();
      ctx.arc(W * 0.85, H * 0.18, 280, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(W * 0.15, H * 0.82, 320, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.direction = 'rtl';
      ctx.textAlign = 'right';

      if (nevSession.igStory.showBranding) {
        ctx.fillStyle = th.text;
        ctx.font = '800 38px Cairo, Tajawal, sans-serif';
        ctx.fillText('ناف  |  NEV', W - 76, 125);

        ctx.fillStyle = th.muted;
        ctx.font = '600 26px Cairo, Tajawal, sans-serif';
        ctx.fillText('ستوري منشور • مشاركة إنستغرام', W - 76, 168);
      }

      const padX = 68;
      const cardX = padX;
      const cardY = 250;
      const cardW = W - padX * 2;
      const cardH = nevSession.igStory.showBranding ? 1360 : 1440;

      drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 48);
      ctx.fillStyle = th.cardBg;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = th.cardBorder;
      ctx.stroke();

      const innerX = cardX + 54;
      let yPos = cardY + 64;
      const avSize = 104;

      ctx.save();
      ctx.beginPath();
      ctx.arc(W - innerX - avSize / 2, yPos + avSize / 2, avSize / 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = th.accent;
      ctx.fillRect(W - innerX - avSize, yPos, avSize, avSize);
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 42px Cairo, Tajawal, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((author.name || 'N').charAt(0), W - innerX - avSize / 2, yPos + avSize / 2 + 15);
      ctx.restore();

      ctx.textAlign = 'right';
      ctx.fillStyle = th.text;
      ctx.font = '800 38px Cairo, Tajawal, sans-serif';
      const badgeSymbol = author.verified === 'gold' ? ' ✦' : author.verified === 'gray' ? ' ◆' : author.verified === 'blue' ? ' ✓' : '';
      ctx.fillText(author.name + badgeSymbol, W - innerX - avSize - 26, yPos + 42);

      ctx.fillStyle = th.muted;
      ctx.font = '600 28px Cairo, Tajawal, sans-serif';
      ctx.fillText(`@${author.username} · ${relTime(post.createdAt)}`, W - innerX - avSize - 26, yPos + 86);

      yPos += avSize + 44;

      ctx.strokeStyle = th.cardBorder;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(innerX, yPos);
      ctx.lineTo(W - innerX, yPos);
      ctx.stroke();
      yPos += 46;

      const textW = cardW - 108;
      const hasImg = Boolean(post.image);
      const fontSize = post.content.length > 180 ? 38 : post.content.length > 90 ? 44 : 50;
      const lineStep = Math.round(fontSize * 1.52);
      ctx.font = `700 ${fontSize}px Cairo, Tajawal, sans-serif`;
      ctx.fillStyle = th.text;

      const allLines = wrapCanvasParagraphs(ctx, post.content, textW);
      const maxLines = hasImg ? 7 : 15;
      const shownLines = allLines.slice(0, maxLines);
      if (allLines.length > maxLines && shownLines.length > 0) {
        shownLines[shownLines.length - 1] += '...';
      }

      for (const ln of shownLines) {
        ctx.fillText(ln, W - innerX, yPos + fontSize * 0.8);
        yPos += lineStep;
      }

      if (hasImg) {
        yPos += 24;
        const imgBoxH = Math.max(240, Math.min(420, cardY + cardH - yPos - (nevSession.igStory.showStats ? 150 : 60)));
        if (imgBoxH >= 190) {
          drawRoundedRect(ctx, innerX, yPos, textW, imgBoxH, 28);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fill();
          ctx.fillStyle = th.muted;
          ctx.font = '700 28px Cairo, Tajawal, sans-serif';
          ctx.fillText('🖼️ مرفق صورة من منشور ناف', W - innerX - 24, yPos + imgBoxH / 2 + 10);
          yPos += imgBoxH + 24;
        }
      }

      if (nevSession.igStory.showStats) {
        const statsY = cardY + cardH - 56;
        ctx.fillStyle = th.muted;
        ctx.font = '700 28px Cairo, Tajawal, sans-serif';
        ctx.fillText(
          `♥ ${fmtNum(post.likes.length)} إعجاب    🔁 ${fmtNum(post.retweets.length)} إعادة نشر    💬 ${fmtNum(post.replies.length)} رد`,
          W - innerX,
          statsY
        );
      }

      if (nevSession.igStory.showBranding) {
        ctx.textAlign = 'center';
        ctx.fillStyle = th.muted;
        ctx.font = '700 28px Cairo, Tajawal, sans-serif';
        ctx.fillText('تم إنشاؤها عبر منصة ناف (nev-platform-v3) • جاهزة لستوري إنستغرام', W / 2, H - 110);
      }

      ctx.restore();
    }

    function downloadIgStoryPng(postId) {
      renderIgStoryCanvas();
      const canvas = document.getElementById('v3-ig-canvas');
      if (!canvas) return;
      try {
        const url = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `nev-story-9x16-${postId}.png`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        playNevSound('success');
        notifyNev('تم تحميل صورة الستوري (1080×1920 PNG) لإنستغرام!', 'success');
      } catch (_) {
        notifyNev('تعذر تنزيل الصورة مباشرة، جرّب نسخ الصورة أو مشاركتها', 'error');
      }
    }

    async function copyIgStoryPng() {
      renderIgStoryCanvas();
      const canvas = document.getElementById('v3-ig-canvas');
      if (!canvas) return;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          canvas.toBlob(async (blob) => {
            if (!blob) return;
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            playNevSound('success');
            notifyNev('تم نسخ صورة الستوري إلى الحافظة!', 'success');
          }, 'image/png');
        } else {
          downloadIgStoryPng(nevSession.igStory.postId);
        }
      } catch (_) {
        downloadIgStoryPng(nevSession.igStory.postId);
      }
    }

    async function shareIgStoryPng(postId) {
      renderIgStoryCanvas();
      const canvas = document.getElementById('v3-ig-canvas');
      const post = nevState.posts.find(p => p.id === postId);
      if (!canvas || !post) return;
      try {
        canvas.toBlob(async (blob) => {
          if (blob && navigator.share && navigator.canShare) {
            const file = new File([blob], `nev-story-${postId}.png`, { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'ستوري منصة ناف / Nev',
                text: post.content,
                files: [file]
              });
              playNevSound('success');
              notifyNev('تمت مشاركة الستوري', 'success');
              return;
            }
          }
          downloadIgStoryPng(postId);
        }, 'image/png');
      } catch (_) {
        downloadIgStoryPng(postId);
      }
    }

    function getFilteredHomePosts() {
      const user = getCurrentUser();
      const blocked = user && Array.isArray(user.blocked) ? user.blocked : [];
      const muted = user && Array.isArray(user.muted) ? user.muted : [];

      let list = nevState.posts.filter(p => !blocked.includes(p.userId) && !muted.includes(p.userId));
      if (nevSession.homeTab === 'following' && user) {
        const followingIds = user.following || [];
        list = list.filter(p => followingIds.includes(p.userId) || p.userId === user.id);
      }
      return list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

        const matches = p.content.match(/#[\u0600-\u06FFa-zA-Z0-9_]+/g) || [];
        matches.forEach(t => {
          tagCounts[t] = (tagCounts[t] || 0) + 1;

      (nevState.systemSettings.trendingTags || []).forEach(t => {
        if (!tagCounts[t]) tagCounts[t] = 1;
      });

      const matchedUsers = q
        ? nevState.users.filter(u =>
            String(u.name || '').toLowerCase().includes(q) ||
            String(u.username || '').toLowerCase().includes(q) ||

              <button type="button" onclick="nevSession.notifTab = 'mentions'; renderNevV3()" class="py-2.5 ${nevSession.notifTab === 'mentions' ? 'text-accent border-b-2 border-accent' : 'text-muted'}">الإشارات</button>

    function markAllNotificationsRead() {
      const u = getCurrentUser();
      if (!u) return;
      nevState.notifications.forEach(n => {
        if (n.userId === u.id) n.read = true;
      });
      persistNevV3State();
      playNevSound('pop');
      notifyNev('تم تحديد الإشعارات كمقروءة', 'success');
      renderNevV3();
    }

    function renderMessagesView() {
      const u = requireAuthenticatedUser('الوصول إلى الرسائل الخاصة');
      if (!u) return renderHomeView();

      const activeConv = nevState.conversations.find(c => c.id === nevSession.activeConversationId) || nevState.conversations[0];
      const peerId = activeConv ? activeConv.participants.find(id => id !== u.id) || 'u_sara' : 'u_sara';
      const peer = getUserById(peerId);

      return `
        <div>
          <div class="sticky top-0 z-20 glass-header px-4 py-3 flex items-center justify-between">
            <h2 class="font-black text-base sm:text-lg">الرسائل الخاصة</h2>
            <span class="text-xs text-muted">محادثات ناف</span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 min-h-[460px]">
            <div class="md:col-span-5 border-b md:border-b-0 md:border-l border-theme p-2.5 space-y-1.5 bg-sec/30">
              ${nevState.conversations.map(c => {
                const otherId = c.participants.find(id => id !== u.id) || c.participants[0];
                const other = getUserById(otherId);
                const lastMsg = c.messages[c.messages.length - 1];
                const selected = activeConv && activeConv.id === c.id;
                return `
                  <button type="button"
                          onclick="nevSession.activeConversationId = '${c.id}'; renderNevV3()"
                          class="w-full text-right p-3 rounded-2xl flex items-center gap-2.5 transition ${selected ? 'bg-accent-soft border border-accent/40' : 'hover-theme border border-transparent'}">
                    <img src="${esc(other.avatar)}" alt="${esc(other.name)}" onerror="this.src='https://placehold.co/60x60/1d9bf0/ffffff?text=Nev'" class="w-10 h-10 rounded-full object-cover shrink-0" />
                    <div class="min-w-0 flex-1">
                      <div class="font-extrabold text-xs sm:text-sm flex items-center gap-1 truncate">
                        <span>${esc(other.name)}</span>
                        ${renderVerificationBadge(other)}
                      </div>
                      <div class="text-[11px] text-muted truncate">${lastMsg ? esc(lastMsg.text) : 'ابدأ محادثة'}</div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="md:col-span-7 flex flex-col justify-between">
              ${activeConv ? `
                <div class="p-4 space-y-3 flex-1 max-h-[380px] overflow-y-auto">
                  <div class="text-center text-xs text-muted pb-2 border-b border-theme">
                    محادثة مع <strong>${esc(peer.name)}</strong> (<span dir="ltr">@${esc(peer.username)}</span>)
                  </div>
                  ${activeConv.messages.map(m => {
                    const mine = m.senderId === u.id;
                    return `
                      <div class="flex ${mine ? 'justify-start' : 'justify-end'}">
                        <div class="max-w-[82%] px-4 py-2.5 rounded-2xl text-xs sm:text-sm leading-relaxed ${mine ? 'bg-accent text-white rounded-br-sm' : 'bg-card border border-theme rounded-bl-sm'}">
                          <div>${esc(m.text)}</div>
                          <div class="text-[10px] opacity-75 mt-1">${relTime(m.createdAt)}</div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="p-3 border-t border-theme bg-sec/40 flex items-center gap-2">
                  <input id="v3-dm-input"
                         type="text"
                         onkeydown="if (event.key === 'Enter') sendDirectMsg('${activeConv.id}')"
                         placeholder="اكتب رسالة إلى ${esc(peer.name)}..."
                         class="flex-1 bg-card border border-theme rounded-full px-4 py-2.5 text-xs sm:text-sm focus:border-accent focus:outline-none" />
                  <button type="button" onclick="sendDirectMsg('${activeConv.id}')" class="bg-accent text-white font-extrabold px-5 py-2.5 rounded-full text-xs sm:text-sm">إرسال</button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function sendDirectMsg(convId) {
      const u = requireAuthenticatedUser('إرسال رسالة');
      if (!u) return;
      const input = document.getElementById('v3-dm-input');
      const text = (input ? input.value : '').trim();
      if (!text) return;

      const conv = nevState.conversations.find(c => c.id === convId);
      if (!conv) return;

      conv.messages.push({
        id: 'm_' + Date.now(),
        senderId: u.id,
        text,
        createdAt: Date.now()
      });
      persistNevV3State();
      playNevSound('success');
      renderNevV3();
    }

    function renderBookmarksView() {
      const u = requireAuthenticatedUser('عرض المحفوظات');
      if (!u) return renderHomeView();

      const saved = nevState.posts.filter(p => Array.isArray(p.bookmarks) && p.bookmarks.includes(u.id));
      return `
        <div>
          <div class="sticky top-0 z-20 glass-header px-4 py-3 flex items-center justify-between">
            <h2 class="font-black text-base sm:text-lg">العلامات المرجعية</h2>
            <span class="text-xs text-muted">${saved.length} محفوظ</span>
          </div>
          ${saved.length === 0 ? `
            <div class="p-10 text-center text-xs text-muted">لا توجد منشورات محفوظة في العلامات المرجعية بعد.</div>
          ` : saved.map(p => renderPostCard(p)).join('')}
        </div>
      `;
    }

    /**
     * =========================================================================
     * 8. PROFILE VIEW (5 TABS + LIVE PREVIEW EDITOR MODAL)
     * =========================================================================
     */
    function openUserProfile(userId) {
      const target = nevState.users.find(u => u.id === userId) || nevState.users[0];
      nevSession.profileUserId = target.id;
      nevSession.profileTab = 'posts';
      nevSession.view = 'profile';
      renderNevV3();
      window.scrollTo(0, 0);
    }

    function handleFollowUser(targetUserId) {
      const u = requireAuthenticatedUser('متابعة المستخدم');
      if (!u || u.id === targetUserId) return;
      const target = nevState.users.find(item => item.id === targetUserId);
      if (!target) return;

      u.following = u.following || [];
      target.followers = target.followers || [];

      const idx = u.following.indexOf(targetUserId);
      if (idx === -1) {
        u.following.push(targetUserId);
        if (!target.followers.includes(u.id)) target.followers.push(u.id);
        nevState.notifications.unshift({
          id: 'n_flw_' + Date.now(),
          userId: target.id,
          actorId: u.id,
          type: 'follow',
          postId: null,
          text: 'بدأ بمتابعتك على منصة ناف',
          read: false,
          createdAt: Date.now()
        });
        playNevSound('success');
        notifyNev(`أصبحت تتابع @${target.username}`, 'success');
      } else {
        u.following.splice(idx, 1);
        target.followers = target.followers.filter(id => id !== u.id);
        playNevSound('pop');
        notifyNev(`تم إلغاء متابعة @${target.username}`, 'info');
      }

      persistNevV3State();
      renderNevV3();
    }

          <div class="rounded-2xl overflow-hidden border border-theme bg-card">

                <input id="v3-edit-web" type="text" value="${esc(target.website)}" class="w-full bg-card border border-theme rounded-xl px-3.5 py-2 text-sm focus:border-accent focus:outline-none" />

            <div>

              <input id="v3-edit-avatar" type="url" value="${esc(target.avatar)}" oninput="if (this.value) document.getElementById('v3-prev-avatar').src = this.value" class="w-full bg-card border border-theme rounded-xl px-3.5 py-2 text-xs focus:border-accent focus:outline-none" />

            <div>
              <label class="block text-muted font-bold mb-1">رابط صورة الغلاف</label>
              <input id="v3-edit-banner" type="url" value="${esc(target.banner)}" oninput="if (this.value) document.getElementById('v3-prev-banner').src = this.value" class="w-full bg-card border border-theme rounded-xl px-3.5 py-2 text-xs focus:border-accent focus:outline-none" />

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full border border-theme hover-theme text-xs font-bold">إلغاء</button>
            <button type="button" onclick="saveProfileEdits('${target.id}')" class="px-5 py-2 rounded-full bg-accent text-white text-xs font-extrabold">حفظ التعديلات</button>
          </div>
        </div>
      `);

    function saveProfileEdits(userId) {
      const target = nevState.users.find(u => u.id === userId);
      if (!target) return;
      const nameVal = (document.getElementById('v3-edit-name')?.value || '').trim();
      if (!nameVal) {
        notifyNev('الاسم الظاهر لا يمكن أن يكون فارغاً', 'error');
        return;
      }
      target.name = nameVal;
      target.bio = (document.getElementById('v3-edit-bio')?.value || '').trim();
      target.location = (document.getElementById('v3-edit-loc')?.value || '').trim();
      target.website = (document.getElementById('v3-edit-web')?.value || '').trim();
      const av = (document.getElementById('v3-edit-avatar')?.value || '').trim();
      const bn = (document.getElementById('v3-edit-banner')?.value || '').trim();
      if (av) target.avatar = av;
      if (bn) target.banner = bn;

      persistNevV3State();
      closeModal();
      playNevSound('success');
      notifyNev('تم حفظ تعديلات الملف الشخصي', 'success');
      renderNevV3();
    }

    function renderProfileView() {
      const profUser = nevState.users.find(u => u.id === nevSession.profileUserId) || nevState.users[0];
      const user = getCurrentUser();
      const isOwn = user && user.id === profUser.id;
      const isFollowing = user && Array.isArray(user.following) && user.following.includes(profUser.id);
      const affOrg = profUser.affiliationOrgId ? nevState.users.find(u => u.id === profUser.affiliationOrgId) : null;

      const postsTab = nevState.posts
        .filter(p => p.userId === profUser.id)
        .sort((a, b) => {
          if (profUser.pinnedPostId === a.id) return -1;
          if (profUser.pinnedPostId === b.id) return 1;
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

      const repliesTab = nevState.posts.filter(
        p => Array.isArray(p.replies) && p.replies.some(r => r.userId === profUser.id)
      );

      const highlightsTab = nevState.posts.filter(
        p => Array.isArray(profUser.highlightedPostIds) && profUser.highlightedPostIds.includes(p.id)
      );

      const mediaTab = nevState.posts.filter(p => p.userId === profUser.id && Boolean(p.image));

      const likesTab = nevState.posts.filter(
        p => Array.isArray(p.likes) && p.likes.includes(profUser.id)
      );

      const tabs = [
        { id: 'posts', label: 'المنشورات' },
        { id: 'replies', label: 'الردود' },
        { id: 'highlights', label: 'المميزة' },
        { id: 'media', label: 'معرض الوسائط' },
        { id: 'likes', label: 'الإعجابات' }
      ];

      return `
        <div>
          <div class="sticky top-0 z-20 glass-header px-4 py-2.5 flex items-center justify-between">

              <h2 class="font-black text-base flex items-center gap-1.5">

              <i class="fa-solid fa-arrow-left"></i>
            </button>
          </div>

          <div>
            <div class="h-36 sm:h-48 w-full bg-card overflow-hidden">
              <img src="${esc(profUser.banner)}" alt="الغلاف" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80'" class="w-full h-full object-cover" />

              <div class="flex items-end justify-between -mt-12 sm:-mt-14 mb-3">

                <div class="flex items-center gap-2 pt-12 flex-wrap">
                  ${isOwn || isCurrentAdmin() ? `
                    <button type="button" onclick="openEditProfileModal('${profUser.id}')" class="px-4 py-2 rounded-full border border-theme hover-theme text-xs font-extrabold transition">
                      تعديل الملف الشخصي
                    </button>
                  ` : ''}
                  ${user && user.id !== profUser.id ? `
                    <button type="button" onclick="handleFollowUser('${profUser.id}')" class="px-5 py-2 rounded-full text-xs font-extrabold transition ${isFollowing ? 'border border-theme hover-theme text-main' : 'bg-accent text-white shadow'}">

                  </h1>
                  <div class="text-xs text-muted" dir="ltr">@${esc(profUser.username)}</div>
                  ${affOrg ? `
                    <div class="inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-full bg-card border border-theme text-[11px] text-muted">
                      <img src="${esc(affOrg.avatar)}" alt="${esc(affOrg.name)}" onerror="this.style.display='none'" class="w-4 h-4 rounded-full object-cover" />

                  ${profUser.website ? `<a href="${esc(profUser.website)}" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline"><i class="fa-solid fa-link ml-1"></i>${esc(profUser.website)}</a>` : ''}

                <span>${t.label}</span>
                ${nevSession.profileTab === t.id ? `<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 rounded-full bg-accent"></span>` : ''}

                : highlightsTab.map(p => renderPostCard(p)).join('')
            ) : ''}

            ${nevSession.profileTab === 'media' ? (
              mediaTab.length === 0
                ? `<div class="p-10 text-center text-xs text-muted">لا توجد وسائط مرفقة بعد.</div>`

    /**
     * =========================================================================
     * 10. STRICTLY PROTECTED ADMIN DASHBOARD + BOTS + SYSTEM TOOLS
     * =========================================================================
     */
    function executeEngagementBot() {
      if (!isCurrentAdmin()) {
        playNevSound('error');
        notifyNev('مرفوض! بوت التفاعل متاح حصراً لحساب الأدمن.', 'error');
        return;
      }

      const targetUser = nevState.users.find(u => u.id === nevSession.bot.targetUserId) || nevState.users[0];
      const targetPost = nevState.posts.find(p => p.id === nevSession.bot.targetPostId) || nevState.posts[0];

      const addLikes = Math.max(0, parseInt(nevSession.bot.likes, 10) || 0);
      const addFollowers = Math.max(0, parseInt(nevSession.bot.followers, 10) || 0);
      const addReposts = Math.max(0, parseInt(nevSession.bot.reposts, 10) || 0);
      const addReplies = Math.max(0, parseInt(nevSession.bot.replies, 10) || 0);
      const addBookmarks = Math.max(0, parseInt(nevSession.bot.bookmarks, 10) || 0);
      const addViews = Math.max(0, parseInt(nevSession.bot.views, 10) || 0);

      if (!addLikes && !addFollowers && !addReposts && !addReplies && !addBookmarks && !addViews) {
        notifyNev('حدد عدداً أكبر من الصفر لزيادة اللايكات أو المتابعين أو التفاعل', 'warning');
        return;
      }

      const sampleReplies = [
        'محتوى مميز جداً على منصة ناف! 👏✨',
        'طرح رائع وفي الصميم 🔥🚀',
        'إبداع مستمر في مجتمع ناف / Nev 💡',
        'مشاركة مفيدة جداً يعطيكم العافية 🌟'
      ];

      if (targetPost) {
        for (let i = 0; i < addLikes; i++) {
          targetPost.likes.push(`bot_lk_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 6)}`);
        }
        for (let i = 0; i < addReposts; i++) {
          targetPost.retweets.push(`bot_rp_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 6)}`);
        }
        for (let i = 0; i < addBookmarks; i++) {
          targetPost.bookmarks.push(`bot_bm_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 6)}`);
        }
        for (let i = 0; i < Math.min(addReplies, 25); i++) {
          targetPost.replies.push({
            id: `bot_rep_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 5)}`,
            userId: 'u_admin',
            content: sampleReplies[i % sampleReplies.length],
            createdAt: Date.now()
          });
        }
        targetPost.views = (targetPost.views || 0) + addViews + (addLikes * 5);
      }

      if (targetUser && addFollowers > 0) {
        for (let i = 0; i < addFollowers; i++) {
          targetUser.followers.push(`bot_fw_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 6)}`);
        }
        if (nevSession.bot.addNotifications) {
          nevState.notifications.unshift({
            id: 'n_bot_' + Date.now(),
            userId: targetUser.id,
            actorId: 'u_admin',
            type: 'follow',
            postId: targetPost ? targetPost.id : null,
            text: `زيادة متابعين عبر بوت الإدارة (+${addFollowers} متابع)`,
            read: false,
            createdAt: Date.now()
          });
        }
      }

      const parts = [];
      if (addLikes > 0 && targetPost) parts.push(`+${addLikes} لايك`);
      if (addFollowers > 0 && targetUser) parts.push(`+${addFollowers} متابع لـ @${targetUser.username}`);
      if (addReposts > 0 && targetPost) parts.push(`+${addReposts} إعادة نشر`);
      if (addReplies > 0 && targetPost) parts.push(`+${addReplies} رد`);
      if (addBookmarks > 0 && targetPost) parts.push(`+${addBookmarks} حفظ`);
      if (addViews > 0 && targetPost) parts.push(`+${addViews} مشاهدة`);

      nevState.botLogs.unshift({
        id: 'botlog_' + Date.now(),
        action: 'تشغيل بوت التفاعل',
        targetLabel: targetUser ? `@${targetUser.username}` : 'المنصة',
        details: parts.join(' • '),
        createdAt: Date.now()
      });

      persistNevV3State();
      playNevSound('success');
      notifyNev(`تم تشغيل البوت: ${parts.join('، ')}`, 'success');
      renderNevV3();
    }

    function executeFakeAccountsBot() {
      if (!isCurrentAdmin()) {
        playNevSound('error');
        notifyNev('مرفوض! إنشاء الحسابات الوهمية متاح حصراً لحساب الأدمن.', 'error');
        return;
      }

      const count = Math.max(1, Math.min(25, parseInt(nevSession.bot.fakeCount, 10) || 5));
      const cleanPrefix = (nevSession.bot.fakePrefix || '').trim().replace(/[^a-zA-Z0-9_]/g, '');
      const verifiedTier = nevSession.bot.fakeVerified || 'none';
      const autoFollow = Boolean(nevSession.bot.fakeAutoFollow);
      const targetUser = nevState.users.find(u => u.id === nevSession.bot.targetUserId) || nevState.users[0];

      const firstNames = ['آدم', 'ليلى', 'عمر', 'نور', 'كريم', 'مريم', 'زياد', 'سلمى', 'هاني', 'رنا', 'ياسين', 'دينا'];
      const lastNames = ['المنصور', 'العتيبي', 'الحسن', 'الرحمن', 'الهاشمي', 'المالكي', 'الزهراني', 'البدري', 'السعيد', 'العمري'];
      const bios = [
        'حساب تجريبي على منصة ناف (Nev) 🌐✨',
        'مهتم بالتقنية والابتكار العربي #ناف',
        'متابع نشط لمجتمع ناف ومستجداته 🚀',
        'صانع محتوى رقمي على Nev 💡'
      ];

      const handles = [];
      for (let i = 0; i < count; i++) {
        const fn = firstNames[(nevState.users.length + i) % firstNames.length];
        const ln = lastNames[(nevState.users.length * 3 + i) % lastNames.length];
        const fullName = `${fn} ${ln}`;
        const suffix = Math.floor(100 + Math.random() * 9000);
        const base = cleanPrefix || `nev_user_${i + 1}`;
        const username = `${base}_${suffix}`;
        const fakeId = `u_fake_${Date.now()}_${i}_${Math.random().toString(36).slice(2, 5)}`;

        const fakeAcc = {
          id: fakeId,
          name: fullName,
          username,
          email: `${username}@fake.nev.local`,
          password: 'NevBotUser123',
          bio: bios[(i + nevState.users.length) % bios.length],
          location: 'العالم العربي',
          website: '',
          joinedDate: 'نوفمبر 2026',
          avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(username)}&backgroundColor=b6e3f4,c0aede,ffd5dc,d1d4f9`,
          banner: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80',
          verified: verifiedTier,
          hideVerifiedBadge: false,
          affiliationOrgId: null,
          role: 'user',
          isFakeAccount: true,
          isPrivate: false,
          isBanned: false,
          followers: [],
          following: autoFollow && targetUser ? [targetUser.id] : [],
          blocked: [],
          muted: [],
          pinnedPostId: null,
          highlightedPostIds: [],
          drafts: []
        };

        if (autoFollow && targetUser && !targetUser.followers.includes(fakeId)) {
          targetUser.followers.push(fakeId);
        }

        nevState.users.push(fakeAcc);
        handles.push(`@${username}`);
      }

      nevState.botLogs.unshift({
        id: 'botlog_fake_' + Date.now(),
        action: `إنشاء ${count} حسابات وهمية`,
        targetLabel: targetUser ? `@${targetUser.username}` : 'المنصة',
        details: `تم إنشاء: ${handles.slice(0, 4).join('، ')}${count > 4 ? ` (+${count - 4} أخرى)` : ''}${autoFollow && targetUser ? ` ومتابعة @${targetUser.username}` : ''}`,
        createdAt: Date.now()

      playNevSound('success');
      notifyNev(`تم إنشاء ${count} حسابات وهمية بنجاح!`, 'success');

      if (!u) return;
      u.verified = badge;
      u.hideVerifiedBadge = false;
      persistNevV3State();
      playNevSound('success');
      notifyNev(`تم تحديث التوثيق لحساب @${u.username}`, 'success');
      renderNevV3();
    }

    function adminToggleUserBan(userId) {
      if (!isCurrentAdmin()) return;
      const u = nevState.users.find(item => item.id === userId);
      if (!u || u.role === 'admin') {
        notifyNev('لا يمكن حظر حساب الأدمن الرئيسي', 'warning');

      }
      u.isBanned = !u.isBanned;
      persistNevV3State();

      notifyNev(u.isBanned ? `تم حظر @${u.username}` : `تم فك الحظر عن @${u.username}`, 'info');
      renderNevV3();
    }

    function adminDeleteStoryItem(storyId) {
      if (!isCurrentAdmin()) return;
      nevState.stories = nevState.stories.filter(s => s.id !== storyId);
      persistNevV3State();
      playNevSound('pop');
      notifyNev('تم حذف القصة', 'info');
      renderNevV3();
    }

    function adminResolveReportItem(reportId, deletePost = false) {
      if (!isCurrentAdmin()) return;
      const rep = nevState.reports.find(r => r.id === reportId);
      if (!rep) return;
      rep.status = 'resolved';
      if (deletePost && rep.postId) {
        nevState.posts = nevState.posts.filter(p => p.id !== rep.postId);
      }
      persistNevV3State();
      playNevSound('success');
      notifyNev('تمت معالجة البلاغ', 'success');
      renderNevV3();
    }

    function adminAddBannedWord() {
      if (!isCurrentAdmin()) return;
      const inp = document.getElementById('v3-banned-word');
      const word = (inp ? inp.value : '').trim();
      if (!word) return;
      nevState.systemSettings.bannedWords = nevState.systemSettings.bannedWords || [];
      if (!nevState.systemSettings.bannedWords.includes(word)) {
        nevState.systemSettings.bannedWords.push(word);
        persistNevV3State();
        playNevSound('success');
        notifyNev(`تمت إضافة "${word}" إلى الكلمات المحظورة`, 'success');
      }
      if (inp) inp.value = '';
      renderNevV3();
    }

    function adminRemoveBannedWord(word) {
      if (!isCurrentAdmin()) return;
      nevState.systemSettings.bannedWords = (nevState.systemSettings.bannedWords || []).filter(w => w !== word);
      persistNevV3State();
      playNevSound('pop');
      renderNevV3();
    }

    function adminSaveSystemSettings() {
      if (!isCurrentAdmin()) return;
      nevState.systemSettings.platformName = (document.getElementById('v3-sys-name')?.value || '').trim() || 'ناف / Nev';
      nevState.systemSettings.announcement = (document.getElementById('v3-sys-ann')?.value || '').trim();
      const rawTags = document.getElementById('v3-sys-tags')?.value || '';
      nevState.systemSettings.trendingTags = rawTags
        .split(/[,،]/)
        .map(t => t.trim())
        .filter(Boolean)
        .map(t => (t.startsWith('#') ? t : '#' + t));
      nevState.systemSettings.maxPostLength = Math.max(100, Math.min(2000, parseInt(document.getElementById('v3-sys-max')?.value, 10) || 280));
      persistNevV3State();
      playNevSound('success');
      notifyNev('تم حفظ إعدادات النظام', 'success');
      renderNevV3();
    }

    function adminExportStateJson() {
      if (!isCurrentAdmin()) return;
      try {
        const json = JSON.stringify(nevState, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nev-platform-v3-backup-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        playNevSound('success');
        notifyNev('تم تصدير النسخة الاحتياطية JSON', 'success');

        notifyNev('تعذر تصدير النسخة الاحتياطية', 'error');

    }
